name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      catalog_source:
        description: Source du catalogue à publier
        required: true
        default: json
        type: choice
        options: [json, cockpit]
      deploy:
        description: Déployer l’aperçu sur GitHub Pages
        required: true
        default: true
        type: boolean
      strict:
        description: Bloquer si Cockpit est indisponible
        required: true
        default: true
        type: boolean

env:
  CATALOG_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.catalog_source || 'json' }}
  COCKPIT_STRICT: ${{ github.event_name == 'workflow_dispatch' && inputs.strict || false }}
  COCKPIT_URL: ${{ vars.COCKPIT_URL }}
  COCKPIT_API_TOKEN: ${{ secrets.COCKPIT_API_TOKEN }}
  COCKPIT_RECIPES_MODEL: ${{ vars.COCKPIT_RECIPES_MODEL || 'recipes' }}
  COCKPIT_PUBLISHED_FIELD: ${{ vars.COCKPIT_PUBLISHED_FIELD || 'status' }}
  COCKPIT_PUBLISHED_VALUE: ${{ vars.COCKPIT_PUBLISHED_VALUE || 'published' }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify and build static site
        run: npm run verify
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy
        id: deployment
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.deploy }}
        uses: actions/deploy-pages@v5
